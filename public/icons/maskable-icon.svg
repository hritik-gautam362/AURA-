<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="60%" stop-color="#A50E2A"/>
      <stop offset="100%" stop-color="#5B000B"/>
    </linearGradient>
    <linearGradient id="mGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD1DC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFA4B6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="mDropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF0F4"/>
      <stop offset="100%" stop-color="#FFCDD2"/>
    </linearGradient>
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe zone -->
  <rect width="512" height="512" fill="url(#mBgGrad)"/>

  <!-- Centered Scaled Content (80% safe zone: within 51px to 461px) -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- Ambient Ring -->
    <circle cx="256" cy="256" r="165" fill="none" stroke="url(#mGlowGrad)" stroke-width="3" opacity="0.45"/>

    <!-- Central Droplet -->
    <g filter="url(#mShadow)">
      <path d="M 256,120 C 256,120 170,234 170,306 C 170,353 208,391 256,391 C 304,391 342,353 342,306 C 342,234 256,120 256,120 Z" 
            fill="url(#mDropGrad)"/>
      <path d="M 256,260 C 250,248 238,240 224,240 C 206,240 192,254 192,272 C 192,298 256,346 256,346 C 256,346 320,298 320,272 C 320,254 306,240 288,240 C 274,240 262,248 256,260 Z" 
            fill="#8B0000" 
            opacity="0.9"/>
    </g>

    <!-- Sparkle -->
    <circle cx="360" cy="160" r="8" fill="#FFF0F4" opacity="0.9"/>
    <path d="M 360,144 Q 360,160 376,160 Q 360,160 360,176 Q 360,160 344,160 Q 360,160 360,144 Z" fill="#FFFFFF"/>
  </g>
</svg>
